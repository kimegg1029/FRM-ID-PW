<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FRM ID/PW" />
  <meta name="description" content="FRM ID/PW · Equipment account manager" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>FRM ID/PW</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #101419;
      --panel-2: #151b22;
      --line: rgba(216, 228, 238, 0.11);
      --line-strong: rgba(216, 228, 238, 0.2);
      --text: #f3f6f8;
      --muted: #848f99;
      --soft: #b6c0c8;
      --accent: #7ee29a;
      --accent-strong: #4ad473;
      --red: #ef7676;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none; }
    body {
      background:
        radial-gradient(ellipse at 85% 0%, rgba(74, 212, 115, 0.06), transparent 38%),
        linear-gradient(180deg, #07090c 0%, #0a0d12 100%);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      letter-spacing: -0.015em;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

    .app-shell {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 24px);
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      margin-bottom: 12px;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.15em;
      font-weight: 700;
      white-space: nowrap;
    }
    .top-brand img {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--line-strong);
      object-fit: cover;
    }
    .icon-btn, .back-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      color: var(--soft);
      transition: transform 0.12s, border-color 0.15s;
    }
    .icon-btn:active, .back-btn:active, .category-card:active, .equipment-row:active, .result-card:active {
      transform: scale(0.985);
    }

    /* Views */
    .view { display: none; transform-origin: 50% 50%; backface-visibility: hidden; }
    .view.active { display: block; animation: viewEnter 360ms cubic-bezier(.2,.75,.25,1) both; }
    .view.active.back-transition { animation: viewBack 360ms cubic-bezier(.2,.75,.25,1) both; }
    @keyframes viewEnter { from { opacity: .35; transform: perspective(900px) translate3d(22px,5px,-28px) rotateY(-7deg) scale(.975); filter: blur(1px); } to { opacity: 1; transform: perspective(900px) translate3d(0,0,0) rotateY(0) scale(1); filter: blur(0); } }
    @keyframes viewBack { from { opacity: .35; transform: perspective(900px) translate3d(-22px,5px,-28px) rotateY(7deg) scale(.975); filter: blur(1px); } to { opacity: 1; transform: perspective(900px) translate3d(0,0,0) rotateY(0) scale(1); filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { .view.active, .view.active.back-transition { animation-duration: 1ms; } }

    /* Hero with Samba Heroes Biomanufacturing Background */
    .hero {
      position: relative;
      height: 172px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      padding: 18px;
      background-color: #0b0f14;
      background-image:
        linear-gradient(90deg, #080b0f 0%, rgba(8, 11, 15, 0.9) 42%, rgba(8, 11, 15, 0.22) 100%),
        url("hero-bg.jpg");
      background-size: cover;
      background-position: right center;
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      max-width: 58%;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 9px;
      letter-spacing: 0.18em;
      font-weight: 800;
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(26px, 7.2vw, 32px);
      letter-spacing: -0.045em;
      line-height: 1;
      font-weight: 850;
      white-space: nowrap;
    }
    .hero h1 span { color: var(--accent); }
    .hero-sub {
      color: #d0d7dd;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .hero-note {
      color: var(--muted);
      font-size: 9px;
      margin-top: 4px;
      letter-spacing: 0.14em;
      white-space: nowrap;
    }

    /* Search */
    .search-wrap { margin: 12px 0 18px; position: relative; }
    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      display: grid;
    }
    .search-input {
      width: 100%;
      height: 46px;
      padding: 0 38px 0 42px;
      border: 1px solid var(--line-strong);
      background: var(--panel);
      border-radius: 13px;
      font-size: 16px;
      outline: none;
    }
    .search-input::placeholder { color: #68737d; }
    .search-input:focus { border-color: rgba(126, 226, 154, 0.5); }
    .clear-search {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: none;
    }

    /* Section Headers */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 10px;
      min-width: 0;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .section-title:before {
      content: "";
      width: 2.5px;
      height: 13px;
      border-radius: 2px;
      background: var(--accent-strong);
    }
    .section-meta {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.1em;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Category Grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .category-card {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      text-align: left;
      transition: transform 0.12s, border-color 0.15s;
    }
    .category-card:hover { border-color: var(--line-strong); }
    .cat-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      color: #d6dee4;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
    }
    .cat-name {
      font-size: 13.5px;
      font-weight: 750;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .cat-chevron { margin-left: auto; color: #5f6b75; flex: 0 0 auto; }

    /* Footer */
    .footer-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #56626c;
      font-size: 9px;
      letter-spacing: 0.12em;
    }
    .footer-brand b { color: #7e8b95; font-size: 10px; letter-spacing: 0.16em; }

    /* Subpage Heading */
    .page-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 14px;
      min-width: 0;
    }
    .page-heading > div { min-width: 0; flex: 1; }
    .page-heading h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-heading p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    /* Buttons */
    .soft-btn, .primary-btn, .danger-btn {
      border-radius: 11px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      background: var(--panel-2);
      color: #dde4e9;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .primary-btn {
      background: linear-gradient(135deg, #98f0ae, #52d877);
      border-color: transparent;
      color: #061209;
    }
    .danger-btn {
      border-color: rgba(239, 118, 118, 0.28);
      color: #f09b9b;
      background: rgba(239, 118, 118, 0.07);
    }

    /* Equipment List & Accordion */
    .sort-select {
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--soft);
      font-size: 11px;
      outline: none;
    }
    .equipment-list { display: flex; flex-direction: column; gap: 8px; }
    .equipment-block { border-radius: 13px; overflow: hidden; }
    .equipment-block.is-expanded .equipment-row {
      border-color: rgba(126, 226, 154, 0.35);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .equipment-row {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      text-align: left;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: transform 0.12s, border-color 0.15s;
    }
    .equipment-index {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(126, 226, 154, 0.1);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
    }
    .equipment-info { min-width: 0; flex: 1; }
    .equipment-name {
      display: block;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipment-sub {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
    }
    .equipment-dates { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:5px; color:var(--muted); font-size:9px; line-height:1.35; }
    .equipment-dates span { white-space:nowrap; }
    .equipment-dates b { color:var(--soft); font-weight:650; }
    .preset-label {
      color: var(--accent);
      border: 1px solid rgba(126, 226, 154, 0.22);
      border-radius: 20px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }
    .equipment-arrow { color: #6c7882; flex: 0 0 auto; display: grid; }
    .equipment-expanded {
      padding: 11px;
      border: 1px solid rgba(126, 226, 154, 0.22);
      border-top: 0;
      border-radius: 0 0 13px 13px;
      background: #0c1015;
    }
    .expanded-actions { display: flex; gap: 7px; margin-top: 8px; }
    .expanded-actions button { flex: 1; }

    /* Search Results */
    .search-results { display: flex; flex-direction: column; gap: 7px; }
    .result-card {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      width: 100%;
    }
    .result-category {
      min-width: 62px;
      color: var(--accent);
      font-size: 9px;
      letter-spacing: 0.08em;
      font-weight: 800;
      white-space: nowrap;
    }
    .result-tag { font-weight: 750; font-size: 13.5px; white-space: nowrap; }
    .result-arrow { margin-left: auto; color: #6c7882; display: grid; }

    /* Detail & Account Card */
    .detail-header {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      margin-bottom: 12px;
    }
    .detail-kicker { color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: 0.16em; }
    .detail-tag { font-size: 22px; font-weight: 850; letter-spacing: -0.03em; margin-top: 4px; white-space: nowrap; }
    .detail-meta { color: var(--muted); font-size: 10px; margin-top: 3px; white-space: nowrap; }

    .account-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px;
      background: var(--panel);
      margin-bottom: 8px;
    }
    .account-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .account-title { font-size: 12px; font-weight: 800; letter-spacing: 0.03em; color: var(--soft); }
    .type-pill {
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 700;
      border-radius: 20px;
      color: #a7eab1;
      border: 1px solid rgba(126, 226, 154, 0.22);
      background: rgba(126, 226, 154, 0.07);
      white-space: nowrap;
    }
    .type-pill.shared {
      color: #9dc4ee;
      border-color: rgba(126, 177, 226, 0.24);
      background: rgba(126, 177, 226, 0.08);
    }
    .field-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      min-width: 0;
    }
    .field-label { flex: 0 0 84px; color: var(--muted); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .inline-actions { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .field-value {
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tiny-btn {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--soft);
    }
    .account-divider { height: 1px; background: var(--line); margin: 11px 0; }
    .date-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .date-box {
      padding: 9px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      min-width: 0;
    }
    .date-box small { color: var(--muted); font-size: 9px; display: block; white-space: nowrap; }
    .date-box b { display: block; margin-top: 4px; font-size: 11.5px; font-weight: 750; white-space: nowrap; }
    .account-actions { display: flex; gap: 6px; margin-top: 10px; }
    .login-btn {
      flex: 1.4;
      min-height: 36px;
      border: 1px solid rgba(126, 226, 154, 0.25);
      border-radius: 9px;
      color: #a1efad;
      background: rgba(126, 226, 154, 0.08);
      font-size: 11px;
      font-weight: 750;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .edit-btn {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--soft);
      background: var(--panel-2);
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .del-icon-btn { flex: 0 0 38px; padding: 0; }

    /* Empty & Modal */
    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state strong { display: block; margin: 6px 0 3px; color: var(--soft); font-size: 12.5px; }
    .empty-state p { margin: 0; font-size: 10.5px; }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      padding: 12px;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 86svh;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: var(--panel);
      padding: 18px 16px;
      animation: modalUp 0.18s ease-out;
    }
    @keyframes modalUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .modal-close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--muted); }
    .form-field { margin-bottom: 11px; }
    .form-field label { display: block; color: var(--soft); font-size: 10.5px; font-weight: 700; margin: 0 0 6px 2px; }
    .optional-label { color: var(--muted); font-size: 9px; font-weight: 500; margin-left: 4px; }
    .form-control {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: #090c10;
      padding: 0 12px;
      font-size: 16px;
      outline: none;
    }
    .form-control:focus { border-color: rgba(126, 226, 154, 0.55); }
    .recent-id-wrap { margin-top: 8px; }
    .recent-id-wrap small { display:block; color:var(--muted); font-size:10px; margin:0 0 6px 2px; }
    .recent-id-list { display:flex; flex-wrap:wrap; gap:6px; }
    .recent-id-chip { border:1px solid rgba(126,226,154,.2); background:rgba(126,226,154,.06); color:#bcecc6; border-radius:18px; padding:6px 10px; font-size:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .radio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .radio-option {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--soft);
      font-size: 12px;
      font-weight: 650;
      background: #090c10;
    }
    .radio-option input { accent-color: var(--accent-strong); margin-right: 7px; }
    .form-actions { display: flex; gap: 8px; margin-top: 16px; }
    .form-actions button { flex: 1; }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      padding: 10px 14px;
      border: 1px solid rgba(126, 226, 154, 0.25);
      border-radius: 24px;
      background: rgba(16, 22, 27, 0.96);
      color: #dff7e3;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: 0.18s;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }
    #homeSettings { display:none !important; }
    .no-match { text-align: center; padding: 20px 10px; color: var(--muted); font-size: 12px; }

    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; }
    }
  </style>
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="topbar">
      <div class="top-brand"><img src="icon.svg" alt="FRM"/><span>PERSONAL EQUIPMENT SYSTEM</span></div>

    </header>

    <section class="view active" id="homeView" aria-label="홈">
      <div class="hero">
        <div class="hero-copy">
          <h1>FRM ID<span> / </span>PW</h1>
          <div class="hero-sub">Samsung Biologics</div>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>
        <input class="search-input" id="globalSearch" type="search" autocomplete="off" placeholder="Tag No. 검색" aria-label="Tag No. 검색"/>
        <button class="clear-search" id="clearSearch" aria-label="검색어 지우기">✕</button>
      </div>

      <div id="searchPanel" class="hidden">
        <div class="section-head"><h3 class="section-title">검색 결과</h3><span class="section-meta" id="searchCount"></span></div>
        <div class="search-results" id="searchResults"></div>
      </div>

      <div id="homeContent">
        <div class="section-head"><h3 class="section-title">장비 카테고리</h3><span class="section-meta">4 CATEGORIES</span></div>
        <div class="category-grid" id="categoryGrid"></div>
        <div class="footer-brand"><b>FRM ID/PW</b><span>INTERNAL TOOL · v1.8</span></div>
      </div>
    </section>

    <section class="view" id="categoryView" aria-label="카테고리 장비 목록">
      <div class="page-heading">
        <button class="back-btn" data-back aria-label="뒤로 가기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
        <div><h2 id="categoryTitle">MIXER</h2><p id="categorySubtitle">장비 목록</p></div>
      </div>
      <div class="section-head">
        <h3 class="section-title">EQUIPMENT</h3>
        <select id="equipmentSort" class="sort-select" aria-label="장비 정렬">
          <option value="name">이름순</option>
          <option value="recent">최근 사용순</option>
        </select>
      </div>
      <div class="equipment-list" id="equipmentList"></div>
      <div style="margin-top:12px"><button class="soft-btn" id="addEquipmentBtn" style="width:100%">＋ 장비 Tag No. 추가</button></div>
    </section>

    <section class="view" id="equipmentView" aria-label="장비 상세">
      <div class="page-heading">
        <button class="back-btn" data-back aria-label="뒤로 가기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
        <div><h2>장비 상세</h2><p id="equipmentCategoryLabel">EQUIPMENT DETAILS</p></div>
      </div>
      <div id="equipmentDetail"></div>
    </section>


  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h3 id="modalTitle">추가</h3><button class="modal-close" id="modalClose" aria-label="닫기">✕</button></div>
      <form id="modalForm"></form>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const STORE_KEY = 'frm_idpw_data_v1';
  const CATEGORIES = [
    { id:'MIXER', name:'MIXER', icon:'mixer' },
    { id:'MCS', name:'MCS', icon:'mcs' },
    { id:'VAL', name:'VAL', icon:'val' },
    { id:'ETC', name:'ETC/공용', icon:'etc' }
  ];
  const MIXER_PRESETS = ['SMU-3012','SMU-3008','SMU-3009','SMU-3010','SMU-3052'];
  const MCS_PRESETS = ['MCS'];
  const ETC_PRESETS = ['SC','Ph','DFB','P1 8F'];
  const RECENT_IDS_KEY = 'frm_idpw_recent_ids_v1';
  let recentIds = safeParse(localStorage.getItem(RECENT_IDS_KEY) || '[]');
  if (!Array.isArray(recentIds)) recentIds = [];
  recentIds = recentIds.filter(v => typeof v === 'string' && v.trim()).slice(0,8);
  let state = loadState();
  let currentCategory = 'MIXER';
  let currentEquipmentId = null;
  let expandedEquipmentId = null;
  let equipmentSort = 'name';
  let currentView = 'homeView';
  let viewStack = [];
  let toastTimer = null;
  const $ = (id) => document.getElementById(id);

  function uid(prefix='id') { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`; }
  function localDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function safeParse(raw) { try { return JSON.parse(raw); } catch { return null; } }
  function loadState() {
    const stored = safeParse(localStorage.getItem(STORE_KEY) || 'null');
    let data = stored && Array.isArray(stored.equipment) ? stored : { equipment:[] };
    const presetGroups = [
      ['MIXER', MIXER_PRESETS],
      ['MCS', MCS_PRESETS],
      ['ETC', ETC_PRESETS]
    ];
    for (const [category, tags] of presetGroups) {
      for (const tag of tags) {
        const exists = data.equipment.some(e => e.category === category && e.tagNo.toLowerCase() === tag.toLowerCase());
        if (!exists) data.equipment.push({ id:`preset-${category.toLowerCase()}-${tag.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`, category, tagNo:tag, preset:true, accounts:[] });
      }
    }
    data.equipment.forEach(e => { if (!Array.isArray(e.accounts)) e.accounts = []; });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { console.warn('Local storage unavailable', e); }
    return data;
  }
  function rememberRecentId(username) {
    const value = String(username || '').trim();
    if (!value) return;
    recentIds = [value, ...recentIds.filter(item => item.toLowerCase() !== value.toLowerCase())].slice(0,8);
    try { localStorage.setItem(RECENT_IDS_KEY, JSON.stringify(recentIds)); } catch {}
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch { showToast('저장 공간 오류'); }
    renderCategories();
  }
  function escapeHTML(value='') {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function formatDate(date) {
    if (!date) return '미입력';
    const [y,m,d] = date.split('-');
    return y && m && d ? `${y}.${m}.${d}` : date;
  }
  function elapsedDays(date) {
    if (!date) return null;
    const a = new Date(`${date}T00:00:00`);
    const b = new Date(`${localDate()}T00:00:00`);
    const diff = Math.floor((b-a)/86400000);
    return Number.isFinite(diff) ? Math.max(0,diff) : null;
  }
  function showToast(message) {
    const el = $('toast'); el.textContent = message; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }
  function icon(name, size=19) {
    const paths = {
      mixer:'<path d="M7 4h10l1 4-2 2v9H8v-9L6 8l1-4Z"/><path d="M8 8h8M10 12h4M10 16h4M5 20h14"/>',
      mcs:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M7 12l3-3 3 2 4-4"/>',
      val:'<path d="M12 3v5m-6 0h12M7 8v4l-3 3v4h16v-4l-3-3V8M9 15h6M10 19v2m4-2v2"/><circle cx="12" cy="12" r="1.5"/>',
      etc:'<path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
      chevron:'<path d="m9 18 6-6-6-6"/>',
      chevronDown:'<path d="m6 9 6 6 6-6"/>',
      chevronUp:'<path d="m6 15 6-6 6 6"/>',
      search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',
      copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/>',
      edit:'<path d="m4 16.5-.8 4.3 4.3-.8L19 8.5 15.5 5 4 16.5Z"/><path d="m13.8 6.7 3.5 3.5"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>'
    };
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.chevron}</svg>`;
  }
  function navigate(viewId, push=true) {
    if (push && currentView !== viewId) viewStack.push(currentView);
    currentView = viewId;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === viewId));
    window.scrollTo({ top:0, behavior:'instant' });
  }
  function goBack() {
    if ($('modalBackdrop').classList.contains('open')) { closeModal(); return; }
    const previous = viewStack.pop();
    if (previous) {
      currentView = previous;
      document.querySelectorAll('.view').forEach(v => { v.classList.toggle('active', v.id === previous); v.classList.remove('back-transition'); });
      const targetView = $(previous); if (targetView) { targetView.classList.add('back-transition'); setTimeout(() => targetView.classList.remove('back-transition'), 400); }
      window.scrollTo({top:0, behavior:'instant'});
    } else if (currentView !== 'homeView') {
      currentView = 'homeView';
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'homeView'));
    }
  }
  document.querySelectorAll('[data-back]').forEach(btn => btn.addEventListener('click', goBack));
  // 앱 정보 화면은 사용하지 않습니다.

  function renderCategories() {
    $('categoryGrid').innerHTML = CATEGORIES.map(c =>
      `<button class="category-card" data-category="${c.id}"><span class="cat-icon">${icon(c.icon,20)}</span><span class="cat-name">${c.name}</span><span class="cat-chevron">${icon('chevron',16)}</span></button>`
    ).join('');
    document.querySelectorAll('[data-category]').forEach(btn => btn.addEventListener('click', () => openCategory(btn.dataset.category)));
  }

  function openCategory(category) {
    currentCategory = category;
    const meta = CATEGORIES.find(c => c.id === category);
    $('categoryTitle').textContent = meta ? meta.name : category;
    renderEquipmentList();
    navigate('categoryView');
  }

  function renderEquipmentList() {
    const all = state.equipment.filter(e => e.category === currentCategory);
    all.sort((a,b) => {
      if (equipmentSort === 'recent') {
        const aDate = (a.accounts||[])[0]?.lastLoginAt || '';
        const bDate = (b.accounts||[])[0]?.lastLoginAt || '';
        if (aDate !== bDate) return bDate.localeCompare(aDate);
      }
      return a.tagNo.localeCompare(b.tagNo, undefined, { numeric:true });
    });
    $('categorySubtitle').textContent = currentCategory === 'MIXER' ? 'PRESET EQUIPMENT' : 'EQUIPMENT LIST';
    const sortControl = $('equipmentSort');
    if (sortControl) {
      sortControl.value = equipmentSort;
      sortControl.onchange = () => { equipmentSort = sortControl.value; renderEquipmentList(); };
    }
    const list = $('equipmentList');
    if (!all.length) {
      list.innerHTML = `<div class="empty-state">${icon('search',22)}<strong>등록된 장비가 없습니다</strong><p>하단 버튼으로 Tag No.를 추가하세요.</p></div>`;
      return;
    }
    list.innerHTML = all.map((e,i) => {
      const open = expandedEquipmentId === e.id;
      const accounts = e.accounts || [];
      return `<div class="equipment-block ${open?'is-expanded':''}">
        <button class="equipment-row" data-equipment-toggle="${escapeHTML(e.id)}" aria-expanded="${open?'true':'false'}">
          <span class="equipment-index">${String(i+1).padStart(2,'0')}</span>
          <span class="equipment-info">
            <span class="equipment-name">${escapeHTML(e.tagNo)}</span>
            <span class="equipment-sub">${accounts.length ? escapeHTML(accounts[0].username) : '계정 미등록'}</span>
            <span class="equipment-dates"><span><b>PW 교체</b> ${escapeHTML(formatDate(accounts[0]?.passwordChangedAt))}</span><span><b>로그인 성공</b> ${escapeHTML(formatDate(accounts[0]?.lastLoginAt))}</span></span>
          </span>
          ${e.preset ? '<span class="preset-label">기본</span>' : ''}
          <span class="equipment-arrow">${icon(open?'chevronUp':'chevronDown',17)}</span>
        </button>
        ${open ? `<div class="equipment-expanded">
          ${accounts.length ? accountHTML(accounts[0]) : `<div class="empty-state" style="padding:14px 10px"><strong>계정 미등록</strong></div>`}
          <div class="expanded-actions">
            ${accounts.length ? '' : `<button class="primary-btn" data-add-inline="${escapeHTML(e.id)}">＋ 계정 등록</button>`}
            <button class="soft-btn" data-full-detail="${escapeHTML(e.id)}">상세 관리</button>
          </div>
        </div>` : ''}
      </div>`;
    }).join('');

    list.querySelectorAll('[data-equipment-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.equipmentToggle;
      expandedEquipmentId = expandedEquipmentId === id ? null : id;
      renderEquipmentList();
    }));
    list.querySelectorAll('[data-add-inline]').forEach(btn => btn.addEventListener('click', () => {
      const equipment = state.equipment.find(e => e.id === btn.dataset.addInline);
      if (equipment && !(equipment.accounts||[]).length) openAccountModal(null, equipment, renderEquipmentList);
    }));
    list.querySelectorAll('[data-full-detail]').forEach(btn => btn.addEventListener('click', () => openEquipment(btn.dataset.fullDetail)));
    all.forEach(e => {
      const block = list.querySelector(`[data-equipment-toggle="${CSS.escape(e.id)}"]`)?.parentElement;
      if (block && expandedEquipmentId === e.id) bindAccountActions(block, e, renderEquipmentList);
    });
  }

  function openEquipment(id) {
    currentEquipmentId = id;
    renderEquipmentDetail();
    navigate('equipmentView');
  }
  function getCurrentEquipment() { return state.equipment.find(e => e.id === currentEquipmentId); }

  function renderEquipmentDetail() {
    const e = getCurrentEquipment(); if (!e) { goBack(); return; }
    const category = CATEGORIES.find(c => c.id === e.category);
    $('equipmentCategoryLabel').textContent = `${category ? category.name : e.category}`;
    const accounts = e.accounts || [];
    $('equipmentDetail').innerHTML = `
      <div class="detail-header">
        <div class="detail-kicker">TAG NO.</div>
        <div class="detail-tag">${escapeHTML(e.tagNo)}</div>
        <div class="detail-meta">${escapeHTML(category ? category.name : e.category)}</div>
      </div>
      ${accounts.length ? accountHTML(accounts[0]) : `<div class="empty-state" style="margin-bottom:10px"><strong>등록된 계정이 없습니다</strong></div>`}
      ${accounts.length ? '' : '<button class="primary-btn" id="addAccountBtn" style="width:100%;margin-bottom:8px">＋ 계정 등록</button>'}
      <div style="display:flex;gap:8px">
        ${e.preset ? '<button class="soft-btn" style="flex:1;opacity:.5" disabled>기본 장비 고정</button>' : '<button class="danger-btn" id="deleteEquipmentBtn" style="flex:1">장비 삭제</button>'}
        ${e.preset ? '' : '<button class="soft-btn" id="renameEquipmentBtn" style="flex:1">Tag No. 수정</button>'}
      </div>`;
    if ($('addAccountBtn')) $('addAccountBtn').addEventListener('click', () => openAccountModal(null, e, renderEquipmentDetail));
    if ($('renameEquipmentBtn')) $('renameEquipmentBtn').addEventListener('click', () => openEquipmentModal(e));
    if ($('deleteEquipmentBtn')) $('deleteEquipmentBtn').addEventListener('click', () => deleteEquipment(e.id));
    bindAccountActions($('equipmentDetail'), e, renderEquipmentDetail);
  }

  function accountHTML(a) {
    const shared = a.type === 'SHARED';
    const elapsed = elapsedDays(a.passwordChangedAt);
    const pass = a.password || '';
    return `<article class="account-card">
      <div class="account-top">
        <div class="account-title">ACCOUNT</div>
        <span class="type-pill ${shared?'shared':''}">${shared?'공용 계정':'개인 계정'}</span>
      </div>
      <div class="field-line">
        <span class="field-label">ID</span>
        <span class="inline-actions">
          <span class="field-value">${escapeHTML(a.username||'미등록')}</span>
          <button class="tiny-btn" data-action="copy-user" data-value="${escapeHTML(a.username||'')}" aria-label="ID 복사">${icon('copy',14)}</button>
        </span>
      </div>
      <div class="field-line">
        <span class="field-label">PASSWORD</span>
        <span class="inline-actions">
          <span class="field-value">${escapeHTML(pass||'미등록')}</span>
          ${pass ? `<button class="tiny-btn" data-action="copy-pass" data-value="${escapeHTML(pass)}" aria-label="비밀번호 복사">${icon('copy',14)}</button>` : ''}
        </span>
      </div>
      <div class="account-divider"></div>
      <div class="date-pair">
        <div class="date-box">
          <small>비밀번호 변경일${elapsed!==null ? ` (D+${elapsed})` : ''}</small>
          <b>${formatDate(a.passwordChangedAt)}</b>
        </div>
        <div class="date-box">
          <small>최근 로그인</small>
          <b>${formatDate(a.lastLoginAt)}</b>
        </div>
      </div>
      <div class="account-actions">
        <button class="login-btn" data-action="login" data-account="${escapeHTML(a.id)}">${icon('check',14)} 로그인 성공</button>
        <button class="edit-btn" data-action="edit" data-account="${escapeHTML(a.id)}">${icon('edit',13)} 수정</button>
        <button class="edit-btn del-icon-btn" data-action="delete-account" data-account="${escapeHTML(a.id)}" aria-label="계정 삭제">${icon('trash',13)}</button>
      </div>
    </article>`;
  }

  function bindAccountActions(container, equipment, rerender) {
    container.querySelectorAll('[data-action="login"]').forEach(btn => btn.addEventListener('click', () => {
      const account = equipment.accounts.find(a => a.id === btn.dataset.account); if (!account) return;
      account.lastLoginAt = localDate(); saveState(); rerender(); showToast('로그인 성공일 기록 완료');
    }));
    container.querySelectorAll('[data-action="edit"]').forEach(btn => btn.addEventListener('click', () => {
      const account = equipment.accounts.find(a => a.id === btn.dataset.account); if (account) openAccountModal(account, equipment, rerender);
    }));
    container.querySelectorAll('[data-action="delete-account"]').forEach(btn => btn.addEventListener('click', () => deleteAccount(btn.dataset.account, equipment, rerender)));
    container.querySelectorAll('[data-action="copy-user"]').forEach(btn => btn.addEventListener('click', () => copyText(btn.dataset.value, 'ID 복사됨')));
    container.querySelectorAll('[data-action="copy-pass"]').forEach(btn => btn.addEventListener('click', () => copyText(btn.dataset.value, '비밀번호 복사됨')));
  }

  async function copyText(value, message) {
    if (!value) { showToast('복사할 내용 없음'); return; }
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
      else {
        const field = document.createElement('textarea');
        field.value = value; field.style.position = 'fixed'; field.style.opacity = '0';
        document.body.appendChild(field); field.select(); document.execCommand('copy'); field.remove();
      }
      showToast(message);
    } catch { showToast('복사 실패'); }
  }
  function deleteEquipment(id) {
    const e = state.equipment.find(x => x.id === id); if (!e || e.preset) return;
    if (!confirm(`${e.tagNo} 장비를 삭제할까요?`)) return;
    state.equipment = state.equipment.filter(x => x.id !== id);
    saveState(); showToast('장비 삭제됨'); goBack(); renderEquipmentList();
  }

  function deleteAccount(id, equipment=getCurrentEquipment(), rerender=renderEquipmentDetail) {
    if (!equipment || !confirm('계정을 삭제할까요?')) return;
    equipment.accounts = equipment.accounts.filter(a => a.id !== id);
    saveState(); rerender(); showToast('계정 삭제됨');
  }

  function openModal(title, content, onSubmit) {
    $('modalTitle').textContent = title;
    $('modalForm').innerHTML = content;
    $('modalBackdrop').classList.add('open');
    $('modalForm').onsubmit = (ev) => { ev.preventDefault(); onSubmit(new FormData($('modalForm'))); };
    setTimeout(() => { const first = $('modalForm').querySelector('input:not([type=hidden]):not([type=radio]),select'); if (first) first.focus(); }, 40);
  }
  function closeModal() { $('modalBackdrop').classList.remove('open'); $('modalForm').onsubmit = null; }
  $('modalClose').addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', ev => { if (ev.target === $('modalBackdrop')) closeModal(); });

  function openEquipmentModal(existing=null) {
    const isEdit = !!existing;
    const options = CATEGORIES.map(c => `<option value="${c.id}" ${(existing?.category || currentCategory) === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
    openModal(isEdit ? 'Tag No. 수정' : '장비 추가', `
      <div class="form-field"><label for="equipmentCategory">카테고리</label><select class="form-control" id="equipmentCategory" name="category">${options}</select></div>
      <div class="form-field"><label for="equipmentTag">Tag No.</label><input class="form-control" id="equipmentTag" name="tagNo" required maxlength="40" placeholder="예: MCS-1001" value="${escapeHTML(existing?.tagNo||'')}" autocomplete="off"/></div>
      <div class="form-actions"><button type="button" class="soft-btn" id="cancelEquipment">취소</button><button type="submit" class="primary-btn">저장</button></div>`, form => {
        const category = form.get('category');
        const tagNo = String(form.get('tagNo')||'').trim().toUpperCase();
        if (!tagNo) return;
        const duplicate = state.equipment.some(e => e.category === category && e.tagNo.toLowerCase() === tagNo.toLowerCase() && e.id !== existing?.id);
        if (duplicate) { showToast('이미 등록된 Tag No.'); return; }
        if (isEdit) { existing.tagNo = tagNo; existing.category = category; }
        else state.equipment.push({ id:uid('equipment'), category, tagNo, preset:false, accounts:[] });
        saveState(); closeModal(); renderEquipmentList();
        if (isEdit) renderEquipmentDetail();
        showToast(isEdit ? '수정 완료' : '등록 완료');
      });
    $('cancelEquipment').addEventListener('click', closeModal);
  }

  function openAccountModal(existing=null, targetEquipment=null, afterSave=null) {
    const e = targetEquipment || getCurrentEquipment(); if (!e) return;
    const isEdit = !!existing;
    openModal(isEdit ? '계정 수정' : '계정 등록', `
      <div class="form-field">
        <div class="radio-row">
          <label class="radio-option"><input type="radio" name="type" value="PERSONAL" ${!existing||existing.type==='PERSONAL'?'checked':''}/>개인 계정</label>
          <label class="radio-option"><input type="radio" name="type" value="SHARED" ${existing?.type==='SHARED'?'checked':''}/>공용 계정</label>
        </div>
      </div>
      <div class="form-field"><label for="accountUser">ID</label><input class="form-control" id="accountUser" name="username" required maxlength="100" placeholder="계정 ID" value="${escapeHTML(existing?.username||'')}" autocomplete="off"/><div class="recent-id-wrap" id="recentIdWrap">${recentIds.length ? '<small>최근 사용한 ID</small><div class="recent-id-list">'+recentIds.map(id => '<button type="button" class="recent-id-chip" data-recent-id="'+escapeHTML(id)+'">'+escapeHTML(id)+'</button>').join('')+'</div>' : '<small>저장된 최근 ID가 없습니다</small>'}</div></div>
      <div class="form-field"><label for="accountPass">PASSWORD</label><input class="form-control" type="text" id="accountPass" name="password" maxlength="200" placeholder="비밀번호" value="${escapeHTML(existing?.password||'')}" autocomplete="off"/></div>
      <div class="form-field"><label for="passwordChanged">비밀번호 변경일 <span class="optional-label">선택</span></label><input class="form-control" type="date" id="passwordChanged" name="passwordChangedAt" value="${escapeHTML(existing?.passwordChangedAt||'')}"/></div>
      <div class="form-field"><label for="lastLogin">최근 로그인 <span class="optional-label">선택</span></label><input class="form-control" type="date" id="lastLogin" name="lastLoginAt" value="${escapeHTML(existing?.lastLoginAt||'')}"/></div>
      <div class="form-actions"><button type="button" class="soft-btn" id="cancelAccount">취소</button><button type="submit" class="primary-btn">저장</button></div>`, form => {
        const data = {
          type: form.get('type'),
          username: String(form.get('username')||'').trim(),
          password: String(form.get('password')||''),
          passwordChangedAt: String(form.get('passwordChangedAt')||''),
          lastLoginAt: String(form.get('lastLoginAt')||'')
        };
        if (!data.username) { showToast('ID를 입력하세요'); return; }
        if (!isEdit && (e.accounts||[]).length) { showToast('장비당 1개 계정만 등록 가능'); return; }
        if (isEdit) Object.assign(existing, data);
        else e.accounts = [{ id:uid('account'), ...data }];
        rememberRecentId(data.username);
        saveState(); closeModal(); (afterSave || renderEquipmentDetail)();
        showToast(isEdit ? '수정 완료' : '등록 완료');
      });
    $('cancelAccount').addEventListener('click', closeModal);
    $('modalForm').querySelectorAll('[data-recent-id]').forEach(btn => btn.addEventListener('click', () => { $('accountUser').value = btn.dataset.recentId; $('accountUser').focus(); }));
  }
  $('addEquipmentBtn').addEventListener('click', () => openEquipmentModal());

  function runSearch(query) {
    const q = query.trim().toLowerCase();
    const panel = $('searchPanel'), home = $('homeContent');
    $('clearSearch').style.display = q ? 'block' : 'none';
    panel.classList.toggle('hidden', !q); home.classList.toggle('hidden', !!q);
    if (!q) return;
    const results = state.equipment.filter(e =>
      e.tagNo.toLowerCase().includes(q) ||
      e.category.toLowerCase().includes(q) ||
      (CATEGORIES.find(c => c.id === e.category)?.name || '').toLowerCase().includes(q)
    );
    $('searchCount').textContent = `${results.length} RESULTS`;
    $('searchResults').innerHTML = results.length
      ? results.sort((a,b) => a.tagNo.localeCompare(b.tagNo, undefined, { numeric:true })).map(e => {
          const cat = CATEGORIES.find(c => c.id === e.category);
          return `<button class="result-card" data-result="${escapeHTML(e.id)}"><span class="result-category">${escapeHTML(cat ? cat.name : e.category)}</span><span class="result-tag">${escapeHTML(e.tagNo)}</span><span class="result-arrow">${icon('chevron',16)}</span></button>`;
        }).join('')
      : '<div class="no-match">일치하는 장비가 없습니다.</div>';
    $('searchResults').querySelectorAll('[data-result]').forEach(btn => btn.addEventListener('click', () => openEquipmentFromSearch(btn.dataset.result)));
  }

  function openEquipmentFromSearch(id) {
    const e = state.equipment.find(x => x.id === id); if (!e) return;
    currentCategory = e.category; currentEquipmentId = id;
    viewStack = []; renderEquipmentDetail(); navigate('equipmentView', false);
  }
  $('globalSearch').addEventListener('input', ev => runSearch(ev.target.value));
  $('clearSearch').addEventListener('click', () => { $('globalSearch').value = ''; runSearch(''); $('globalSearch').focus(); });

  let touchStart = null;
  document.addEventListener('touchstart', ev => {
    if (ev.touches.length !== 1 || $('modalBackdrop').classList.contains('open')) return;
    const t = ev.touches[0];
    if (t.clientX <= 30) touchStart = { x:t.clientX, y:t.clientY, time:Date.now() };
  }, { passive:true });
  document.addEventListener('touchend', ev => {
    if (!touchStart) return;
    const t = ev.changedTouches[0];
    if (t.clientX - touchStart.x > 72 && Math.abs(t.clientY - touchStart.y) < 85 && Date.now() - touchStart.time < 800) goBack();
    touchStart = null;
  }, { passive:true });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if ($('modalBackdrop').classList.contains('open')) closeModal(); else goBack(); }
  });

  renderCategories();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloadingForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !reloadingForUpdate) { reloadingForUpdate = true; window.location.reload(); }
    });
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
        await registration.update();
        if (registration.waiting) registration.waiting.postMessage('SKIP_WAITING');
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) worker.postMessage('SKIP_WAITING');
          });
        });
      } catch (err) {
        console.info('Service worker update check skipped', err);
      }
    });
  }
})();
</script>
</body>
</html>
